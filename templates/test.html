<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
</head>

<body>
  <div id="app">
    <span>{{ msg }}</span>
  </div>
  
  <script src="[[ url_for('static', filename='js/vue.global.js') ]]"></script>
  <script>
    const App = {
      data() {
        return {
          msg: "Hello Vue"
        }
      }
    }

    Vue.createApp(App).mount("#app")
  </script>
</body>

</html>
